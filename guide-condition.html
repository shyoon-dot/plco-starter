<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선수 컨디션 데이터 — 플코 스타터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --pitch: #0A1310; --pitch-line: #172420; --chalk: #F0F3F1;
    --chalk-dim: #ADBFB7; --whistle: #2FB8FF; --card-red: #E2472F; --mute: #79897F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--pitch); color:var(--chalk);
    font-family:'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
    line-height:1.6; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .display{font-family:'Pretendard', 'Noto Sans KR', sans-serif; font-weight:800; letter-spacing:-0.035em;}
  .card{
    max-width:480px; text-align:center;
    background:linear-gradient(160deg, rgba(244,241,232,0.05), rgba(244,241,232,0.015));
    border:1px solid var(--pitch-line);
    border-radius:20px; padding:56px 40px;
  }
  .card .icon{font-size:40px; margin-bottom:20px;}
  .card h1{font-size:26px; margin-bottom:14px;}
  .card p{color:var(--mute); font-size:15px; margin-bottom:32px;}
  .back{
    display:inline-flex; align-items:center; gap:8px;
    color:#04141C; background:var(--whistle);
    font-weight:700; font-size:15px; text-decoration:none;
    padding:14px 28px; border-radius:100px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📊</div>
    <h1 class="display">컨디션 데이터 가이드</h1>
    <p>이 기능에 대한 상세 가이드는 곧 준비됩니다.</p>
    <a href="index.html#features" class="back">상세페이지로 돌아가기</a>
  </div>
</body>
</html>
